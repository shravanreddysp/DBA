name: KBS CORDIS real-data validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KBS_Research/**'
      - '.github/workflows/kbs-cordis-real-data.yml'
  schedule:
    - cron: '17 9 1 * *'
permissions:
  contents: read
jobs:
  validate-official-cordis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        working-directory: KBS_Research
        run: python -m unittest -v test_prepare_cordis.py test_temporal_baselines.py test_knowledge_graph.py test_scalable_baselines.py test_kg_model.py test_audit_results.py
      - name: Download and prepare official CORDIS archive
        working-directory: KBS_Research
        run: python prepare_cordis.py
      - name: Validate actual exported records
        working-directory: KBS_Research
        run: python validate_cordis.py
      - name: Build dated organization-project knowledge graph
        working-directory: KBS_Research
        run: python build_knowledge_graph.py --cutoff 2023-12-31
      - name: Run bounded real-data graph baselines
        working-directory: KBS_Research
        run: python scalable_baselines.py --k 10 --max-queries 250 --max-twohop 2000
      - name: Evaluate temporal KG contextual model on real CORDIS
        working-directory: KBS_Research
        run: python kg_model.py --queries 250
      - name: Audit real-data KG results descriptively
        working-directory: KBS_Research
        run: python audit_results.py
      - name: Summarize verified data manifest
        if: success()
        working-directory: KBS_Research
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('data/processed/manifest.json').read_text())
          kg=json.loads(Path('data/kg_2023/kg_manifest.json').read_text())
          baseline=json.loads(Path('data/processed/scalable_baseline_results.json').read_text())
          model=json.loads(Path('data/processed/kg_model_results.json').read_text())
          audit=json.loads(Path('data/processed/audit_results.json').read_text())
          keys=['source','archive_sha256','archive_bytes','projects_with_dates','projects_with_memberships','organizations_known_by_train_end','training_first_collaboration_edges','validation_first_collaborations','test_first_collaborations']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## CORDIS real-data extraction\n\n')
              for k in keys:
                  f.write(f'- **{k}:** {m.get(k)}\n')
              f.write('\n## Exploratory graph baselines\n\n')
              for split in baseline:
                  f.write(f'### Horizon {split["horizon"]}\n')
                  f.write(f'- Query organizations: {split["query_organizations"]} of {split["total_eligible_query_organizations"]}\n')
                  f.write(f'- Candidate coverage: {split["candidate_coverage"]}\n')
                  for method, value in split["observed_positive_recall_at_k"].items():
                      f.write(f'- {method} observed-positive Recall@{split["k"]}: {value}\n')
              f.write('\\n## Temporal KG context model (exploratory)\\n\\n')
              f.write(f'- Validation-selected weight: {model["chosen_weight"]}\\n')
              for row in model["test"]:
                  f.write(f'- Test seed {row["seed"]}: {row["recall_at_k"]}; candidate coverage {row["candidate_coverage"]}\\n')
              f.write('\\n## Descriptive robustness audit\\n\\n')
              for period, values in audit['summary'].items():
                  f.write(f'- {period}: mean KG minus AA = {values["mean_delta"]:.6f}; seed range [{values["min_delta"]:.6f}, {values["max_delta"]:.6f}]\\n')
              f.write('\\n**Caution:** Passing structural validation does not establish historical point-in-time public availability or entity-resolution accuracy.\n')
          PY
      - name: Upload non-personal validation manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cordis-validation-manifest
          path: |
            KBS_Research/data/processed/manifest.json
            KBS_Research/data/kg_2023/kg_manifest.json
            KBS_Research/data/processed/scalable_baseline_results.json
            KBS_Research/data/processed/kg_model_results.json
            KBS_Research/data/processed/audit_results.json
          retention-days: 30
